<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sneha Biradar — Designer, baker, strategist</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#ffffff;
    --ink:#0e1110;
    --ink-soft:#3c413c;
    --ink-mute:#7a7e77;
    --line:rgba(14,17,16,.10);

    /* card palette (swappable via tweaks) */
    --c-blue:#b8d0e8;
    --c-cream:#f5f1e6;
    --c-orange:#e85e3a;
    --c-orange-ink:#1c0e08;
    --c-sage:#b8d2a4;
    --c-butter:#f5d35a;
    --c-forest:#1e3a2c;
    --c-mint:#e1ecd6;
    --c-ivory:#fbf8f1;
    --c-img:#1f2422;

    --card-r:26px;
    --font-body:"Onest",ui-sans-serif,system-ui,sans-serif;
    --font-display:"Onest",ui-sans-serif,system-ui,sans-serif;
    --font-mark:"Onest",ui-sans-serif,system-ui,sans-serif;
    --font-sans:"Onest",ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  body{min-height:100vh}
  a{color:inherit}
  ::selection{background:#161a17;color:#f7f4ec}

  /* layout */
  .wrap{max-width:1480px;margin:0 auto;padding:32px 56px 112px}
  @media (max-width:760px){ .wrap{padding:20px 20px 56px} }

  /* topbar */
  .topbar{display:flex;justify-content:space-between;align-items:baseline;gap:24px;flex-wrap:wrap}
  .wordmark{font-family:var(--font-mark);font-weight:800;letter-spacing:-.05em;font-size:28px}
  .email{font-size:14.5px;color:var(--ink-soft);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
  .email:hover{border-color:var(--ink-soft)}

  /* hero — compact, photo-left + text-right, group centered */
  .hero{
    display:flex;flex-direction:row;align-items:center;justify-content:center;
    gap:32px;margin:96px auto 48px;max-width:760px;
  }
  @media (max-width:640px){
    .hero{margin:40px auto 32px;gap:20px;flex-direction:column;align-items:center;text-align:center}
  }
  .hero-text{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:480px}
  @media (max-width:640px){ .hero-text{align-items:center;text-align:center} }
  .avatar{
    width:148px;height:148px;border-radius:50%;flex:none;overflow:hidden;
    background:#d8d2c2;position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 14px 36px rgba(20,30,40,.10);
    cursor:pointer;
  }
  @media (max-width:640px){ .avatar{width:128px;height:128px} }
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s ease}
  .avatar .av-default{object-position:50% 35%;opacity:1}
  .avatar .av-hover{object-position:32% 38%;opacity:0}
  .avatar:hover .av-default{opacity:0}
  .avatar:hover .av-hover{opacity:1}
  .hero-text h1{margin:0;font-family:var(--font-mark);font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.035em}
  .hero-text .role{margin:2px 0 0;font-size:13px;font-weight:500;letter-spacing:-.005em;color:var(--ink-soft)}
  .hero-text .bio{margin:10px 0 0;font-size:14.5px;color:var(--ink-soft);max-width:46ch;line-height:1.5}
  .hero-text .loc{margin:10px 0 0;font-size:12.5px;color:var(--ink-mute);display:inline-flex;align-items:center;gap:5px}
  .hero-text .loc svg{width:12px;height:12px}

  /* pills — centered row under hero */
  .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto 56px;max-width:920px}
  .pill{
    appearance:none;border:0;background:rgba(14,17,16,.05);color:var(--ink);
    font-family:var(--font-body);font-weight:600;font-size:13px;line-height:1;letter-spacing:-.005em;
    padding:5px 12px 5px 6px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    transition:transform .12s ease, background .15s, color .15s, opacity .15s;
  }
  .pill .dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
  .pill .dot svg{width:12px;height:12px;display:block}
  /* pills without image dots get tighter left padding */
  .pill:not([data-tone="about"]):not([data-tone="osource"]):not([data-tone="baking"]):not([data-tone="psychology"]){padding-left:11px}
  .pill:not([data-tone="about"]):not([data-tone="osource"]):not([data-tone="baking"]):not([data-tone="psychology"]) .dot{width:16px;height:16px}
  .pill:not([data-tone="about"]):not([data-tone="osource"]):not([data-tone="baking"]):not([data-tone="psychology"]) .dot svg{width:10px;height:10px}
  .pill[data-tone="dark"]{background:#161a17;color:#f7f4ec}
  .pill[data-tone="dark"] .dot{background:rgba(255,255,255,.16)}
  .pill[data-tone="osource"]{background:rgba(14,17,16,.05);color:var(--ink)}
  .pill[data-tone="osource"] .dot{background:transparent;padding:0}
  .pill[data-tone="baking"]{background:#fbeed7;color:#3a2408}
  .pill[data-tone="baking"] .dot{background:transparent;padding:0}
  .pill[data-tone="baking"] .dot img{transform:scale(1.65);transform-origin:center 50%;object-fit:cover}
  .pill[data-tone="psychology"]{background:#dde9f5;color:#102032}
  .pill[data-tone="psychology"] .dot{background:transparent;padding:0}
  .pill[data-tone="psychology"] .dot img{transform:scale(1.7);transform-origin:center;object-fit:cover}
  .pill[data-tone="orange"]{background:#fbd7c9;color:#3a1408}
  .pill[data-tone="orange"] .dot{background:#e85e3a}
  .pill[data-tone="blue"]{background:#dde9f5;color:#102032}
  .pill[data-tone="blue"] .dot{background:#7aa4cf}
  .pill[data-tone="green"]{background:#cfe3c0;color:#0f2419}
  .pill[data-tone="green"] .dot{background:#5a8a47}
  .pill[data-tone="butter"]{background:#fbeab1;color:#2a1f04}
  .pill[data-tone="butter"] .dot{background:transparent;padding:0}
  .pill[data-tone="butter"] .dot img{transform:scale(1.7);transform-origin:center 35%;object-fit:cover}
  .pill[data-tone="ivory"]{background:#f1ece0;color:#2a261b}
  .pill[data-tone="ivory"] .dot{background:#c8bfa5}
  .pill:hover{transform:translateY(-1px)}
  .pill.is-dim{opacity:.32}
  .pill.is-active{outline:2px solid var(--ink);outline-offset:3px}
  .pill.friends{font-family:"Gabriola","Bradley Hand","Comic Sans MS",cursive;font-weight:600;font-size:15px;letter-spacing:0;background:#fbf8f1;border:1px solid rgba(22,26,23,.12)}
  .pill.friends .ch{display:inline-flex;align-items:center;gap:2px}
  .pill.friends .ch i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin:0 2px 2px 2px;font-style:normal}

  /* grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(24,1fr);
    grid-auto-rows:260px;
    gap:16px;
  }
  @media (max-width:980px){ .grid{grid-template-columns:repeat(12,1fr)} }
  @media (max-width:560px){ .grid{grid-template-columns:repeat(2,1fr);gap:14px} }

  .card{
    border-radius:var(--card-r);
    padding:28px;
    position:relative;
    display:flex;flex-direction:column;
    min-height:0;
    overflow:hidden;
    transition:transform .25s cubic-bezier(.2,.7,.2,1), opacity .2s, box-shadow .25s;
    will-change:transform;
  }
  /* tall cards span 2 grid rows (Google-Photos style) */
  .card.is-tall{grid-row:span 2}
  .card.is-dim{opacity:.28;filter:saturate(.7)}
  .card:hover{transform:translateY(-3px)}
  /* trim noise: hover-edit icons retired for a cleaner feel */
  .card .corner-edit{display:none}
  .card:hover .corner-edit{opacity:1}

  .card h3{margin:0 0 12px;font-size:21px;line-height:1.18;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
  .card p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-soft);letter-spacing:-.005em}
  .card .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding-top:18px}
  .card .meta-label{font-size:12.5px;color:rgba(22,26,23,.55);letter-spacing:.01em}
  .card .cta{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:500;text-decoration:none;color:inherit;border-bottom:1px solid currentColor;padding-bottom:2px;align-self:flex-start;margin-top:auto}
  .card .cta svg{width:13px;height:13px}

  /* spans — base layout (24-col grid for finer control) */
  .span-3{grid-column:span 3}
  .span-4{grid-column:span 4}
  .span-5{grid-column:span 5}
  .span-6{grid-column:span 6}
  .span-7{grid-column:span 7}
  .span-8{grid-column:span 8}
  .span-9{grid-column:span 9}
  .span-10{grid-column:span 10}
  .span-12{grid-column:span 12}
  @media (max-width:980px){
    .span-3,.span-4,.span-5,.span-6,.span-7,.span-8,.span-9,.span-10,.span-12{grid-column:span 12}
  }
  @media (max-width:560px){
    .span-3,.span-4,.span-5,.span-6,.span-7,.span-8,.span-9,.span-10,.span-12{grid-column:span 24}
  }

  /* folder card — macOS Finder folder icon */
  .c-folder-wrap{position:relative;background:transparent;padding:0;overflow:visible}
  .c-folder-wrap svg.folder{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 1px 0 rgba(0,0,0,.04)) drop-shadow(0 8px 18px rgba(60,90,140,.10))}
  .c-folder{
    background:transparent;padding:0;min-height:320px;
    background-image:
      radial-gradient(circle at 38px 36px, var(--c-blue) 0 14px, transparent 15px),
      linear-gradient(var(--c-blue),var(--c-blue));
    background-repeat:no-repeat;
    -webkit-mask:
      radial-gradient(28px 28px at 0 28px, transparent 98%, #000 100%) top left/52px 56px no-repeat,
      linear-gradient(#000,#000) 0 56px / 100% calc(100% - 56px) no-repeat,
      linear-gradient(#000,#000) 0 0 / 220px 56px no-repeat,
      radial-gradient(28px 28px at 220px 56px, #000 98%, transparent 100%) 0 0/100% 56px no-repeat;
  }
  /* simpler folder via clip-path */
  .c-folder{
    background:var(--c-blue);
    -webkit-mask:none;mask:none;
    clip-path:polygon(0 8%, 36% 8%, 40% 0, 100% 0, 100% 100%, 0 100%);
    /* fallback: just use border-radius too */
  }
  .c-folder .tab-fill{position:absolute;inset:0;background:var(--c-blue);clip-path:inherit}
  .c-folder .badge{
    position:absolute;right:22px;bottom:22px;
    background:var(--c-butter);color:#1a1404;border-radius:999px;
    padding:11px 20px;font-weight:600;font-size:15px;letter-spacing:-.005em;
    box-shadow:0 1px 0 rgba(0,0,0,.06);
  }

  .c-cream{background:var(--c-cream);color:#1a1c18}
  .c-cream h3{font-family:var(--font-mark);font-size:23px;letter-spacing:-.025em;line-height:1.18;font-weight:700;color:#13130f;margin-bottom:auto;text-wrap:balance}
  .c-cream .meta{display:flex;justify-content:space-between;align-items:center;width:100%;padding-top:14px}
  .c-cream .current-role-label{font-family:"Instrument Serif",serif;font-style:italic;font-size:17px;color:#7a7060;letter-spacing:.01em}
  .c-cream .role-badge{width:46px;height:46px;border-radius:50%;background:#161a17;color:#fff;display:flex;align-items:center;justify-content:center;font:600 9.5px/1 "Geist Mono",monospace;letter-spacing:.04em;flex:none;overflow:hidden}
  .c-cream .role-badge img{width:100%;height:100%;object-fit:cover;display:block}

  /* orange Selected-Work entry card */
  .c-orange{background:var(--c-orange);color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .25s, filter .25s}
  .c-orange:hover{filter:brightness(1.05)}
  .c-orange .ck{font:600 10px/1 "Geist Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:12px}
  .c-orange h3{color:#fff;font-family:var(--font-mark);font-size:20px;font-weight:700;line-height:1.18;letter-spacing:-.02em;margin-bottom:8px;text-wrap:balance;max-width:22ch}
  .c-orange p{color:rgba(255,255,255,.88);font-size:13.5px;line-height:1.4;font-weight:500;letter-spacing:-.005em;max-width:32ch}
  .c-orange .work-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:2;position:relative}
  .c-orange .chip{font:600 10.5px/1 "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:999px;backdrop-filter:blur(6px)}
  .c-orange .open-arrow{font:600 13px/1 var(--font-body);letter-spacing:-.005em;color:#fff;display:inline-flex;align-items:center;gap:6px}

  /* books card (Row 2 third slot) — yellow */
  .c-books{background:var(--c-butter);color:#1f1a04;padding:22px}
  .c-books .kicker{font:600 10px/1 "Geist Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:#5a4a08;margin-bottom:10px}
  .c-books h3{font-family:var(--font-mark);font-size:17px;font-weight:700;letter-spacing:-.015em;line-height:1.2;margin:0 0 12px;text-wrap:balance;color:#1f1a04}
  .c-books .book-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
  .c-books .book-list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px;line-height:1.3;color:#3a2f08;border-bottom:1px dashed rgba(31,26,4,.18);padding-bottom:5px}
  .c-books .book-list li:last-child{border-bottom:0;padding-bottom:0}
  .c-books .bt{font-weight:500;color:#1f1a04;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-books .ba{font-family:"Instrument Serif",serif;font-style:italic;font-size:12.5px;color:#7a6010;flex:none}

  .c-img{background:var(--c-img);color:#fff;padding:0;overflow:hidden;position:relative}
  .c-img .caption{position:absolute;left:18px;right:18px;bottom:18px;font-family:var(--font-mark);font-size:14px;line-height:1.32;color:#fff;font-weight:600;letter-spacing:-.01em;z-index:2;text-shadow:0 2px 12px rgba(0,0,0,.9), 0 0 32px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,1);text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c-img image-slot{position:absolute;inset:0;width:100%;height:100%;border-radius:0;display:block}
  .c-img .c-img-fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s ease}
  .c-img .c-img-fill.is-hover{opacity:0}
  .c-img:hover .c-img-fill.is-default{opacity:0}
  .c-img:hover .c-img-fill.is-hover{opacity:1}
  /* stronger bottom gradient so captions stay readable */
  .c-img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.35) 50%, rgba(0,0,0,0) 100%);pointer-events:none;z-index:1}

  .c-sage{background:var(--c-sage);color:#0e2014}
  .c-sage .word{font-family:var(--font-mark);font-size:64px;font-weight:800;letter-spacing:-.055em;line-height:.95;margin:4px 0 10px;color:#0e2014}
  .c-sage .ipa{font:500 14px/1 "Geist Mono",monospace;color:#1f3a26;margin-bottom:8px}
  .c-sage .pos{font-family:"Instrument Serif",serif;font-style:italic;font-size:16px;color:#0e2014}
  .c-sage .pos b{font-style:normal;font-weight:600;font-family:var(--font-body)}
  .c-sage .deva{font-size:18px;margin:4px 0 8px;color:#1f3a26}
  .c-sage .origin{font-size:13px;color:#1f3a26;line-height:1.4;margin-top:auto;padding-top:10px}

  .c-butter{background:var(--c-butter);color:#1f1a04}
  .c-butter h3{font-family:var(--font-mark);font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.18;text-wrap:balance;margin-bottom:14px;max-width:18ch}
  .c-butter p{color:#3a2f08;font-size:14px;line-height:1.5;max-width:34ch}
  .c-butter .cta{color:#1f1a04;font-size:14px;font-weight:600;border-bottom:1px solid currentColor;align-self:flex-start;padding-bottom:2px;display:inline-flex;align-items:center;gap:6px}
  .c-butter .cta svg{width:13px;height:13px}

  .c-forest{background:var(--c-forest);color:#e8f0e8}
  .c-forest h3{color:#fff;font-family:var(--font-mark);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;max-width:22ch;text-wrap:balance}
  .c-forest p{color:rgba(232,240,232,.78);font-size:15px;line-height:1.5}
  .c-forest .cta{color:#fff}

  .c-mint{background:var(--c-mint);color:#0f2419;text-align:center;align-items:center;justify-content:center;padding:18px 18px;gap:6px;cursor:pointer}
  .c-mint .stamp{font:600 9.5px/1 "Geist Mono",monospace;letter-spacing:.22em;text-transform:uppercase;color:#1f3a26;margin:0}
  .c-mint .seal{
    width:108px;height:108px;border-radius:50%;
    border:1.4px dashed #1f3a26;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:"Instrument Serif",serif;font-size:11.5px;line-height:1.22;letter-spacing:.16em;
    text-transform:uppercase;color:#0e2014;
    margin:4px 0 4px;flex:none;transition:transform .2s}
  .c-mint:hover .seal{transform:scale(1.04) rotate(-3deg)}
  .c-mint .seal span{display:block;padding:0 8px}
  .c-mint .since{font-family:"Instrument Serif",serif;font-style:italic;font-size:12.5px;color:#1f3a26;margin:0;line-height:1.15}
  .c-mint .award{font-family:var(--font-mark);font-weight:700;font-size:14px;line-height:1.22;color:#0e2014;letter-spacing:-.01em;white-space:pre-line;margin:2px 0 0}
  .c-mint .note{font-family:"Instrument Serif",serif;font-style:italic;font-size:11.5px;color:#1f3a26;margin:2px 0 0;letter-spacing:.01em;line-height:1.15}

  /* medal award modal */
  .medal-bg{position:fixed;inset:0;background:rgba(20,16,30,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:70;opacity:0;pointer-events:none;transition:opacity .28s}
  .medal-bg.open{opacity:1;pointer-events:auto}
  .medal-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);
    z-index:71;width:min(380px,calc(100vw - 36px));padding:30px 28px 26px;border-radius:26px;
    background:linear-gradient(180deg,#f4eeff,#e7ddff);text-align:center;
    box-shadow:0 40px 90px rgba(60,30,120,.4),inset 0 1px 0 rgba(255,255,255,.7);
    opacity:0;pointer-events:none;transition:opacity .26s,transform .26s cubic-bezier(.2,.8,.25,1);overflow:hidden}
  .medal-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .medal-modal .medal-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;background:rgba(80,50,140,.10);color:#5a3fb0;display:flex;align-items:center;justify-content:center}
  .medal-modal .medal-x:hover{background:rgba(80,50,140,.18)}
  .medal-modal .medal-kicker{font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7a57c4;margin-bottom:6px}
  .medal-modal .rosette{width:188px;margin:4px auto 6px;overflow:visible}
  .medal-modal .rosette svg{width:100%;height:auto;display:block;transform-origin:50% 38%}
  .medal-modal .medal-title{font-family:var(--font-mark);font-weight:700;font-size:19px;letter-spacing:-.02em;color:#2a1656}
  .medal-modal .medal-sub{font-family:"Instrument Serif",serif;font-style:italic;font-size:13px;color:#6b54a0;margin-top:4px}
  .medal-modal .medal-replay{margin-top:16px;border:0;cursor:pointer;background:#7B61FF;color:#fff;font-family:var(--font-body,"Onest",sans-serif);font-weight:600;font-size:13px;padding:9px 18px;border-radius:999px;transition:background .15s}
  .medal-modal .medal-replay:hover{background:#6a4fe6}
  /* rosette entrance animation (plays inside modal) */
  .rosette.is-play svg{animation:rosetteIn .9s cubic-bezier(.2,.8,.25,1) both}
  @keyframes rosetteIn{0%{transform:translateX(-160%) rotate(-25deg) scale(.7);opacity:0}60%{transform:translateX(6%) rotate(6deg) scale(1.06);opacity:1}100%{transform:translateX(0) rotate(0) scale(1);opacity:1}}
  .rosette.is-play .ring{animation:spinRing 1s cubic-bezier(.2,.8,.25,1) both;transform-origin:100px 100px}

  /* selected work card (bento) — opens horizontal scroll overlay */

  /* selected work overlay — chaos→clarity scrapbook background */
  .work-bg{position:fixed;inset:0;background:#0e0a06;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}

    background-color:#1a140c;
  }

  .work-panel::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;

  .work-panel .nav{appearance:none;border:0;background:rgba(255,255,255,.10);color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}

  .work-panel .nav svg{width:18px;height:18px}

  .work-panel .x{position:absolute;top:42px;right:48px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.10);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .15s;z-index:2}

  .scroller{flex:1;min-height:0;display:flex;align-items:stretch;gap:28px;padding:32px 56px 40px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}

  /* work card — generous, image-led, ~1.5 fits per slide */

  .about-bg{position:fixed;inset:0;background:rgba(15,14,10,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}

  /* legacy projects-grid styles removed — selected work is overlay-only now */
